# No `base` is set, so the app follows the viewer's system light/dark setting
# (switchable from Streamlit's own ⋮ → Settings menu). Only the accent colour is
# customised, per mode.
[theme]
primaryColor = "#10B981"

[theme.light]
# Dark enough for the active tab and selected controls to read as text (5.5:1).
primaryColor = "#047857"

[browser]
gatherUsageStats = false
